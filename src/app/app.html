<nav class="app-nav">
  <a pButton [outlined]="true" severity="secondary" routerLink="/">Finder</a>
  <a pButton [outlined]="true" severity="secondary" routerLink="/favorites">Favorites</a>
  <a pButton [outlined]="true" severity="secondary" routerLink="/trips">Trips</a>
  <a pButton [outlined]="true" severity="secondary" routerLink="/about">About Us</a>
  @if (supabase.isAuthenticated) {
    <a pButton [outlined]="true" severity="secondary" routerLink="/account">Account</a>
    @if (userService.profile()?.role === 'admin') {
      <a pButton [outlined]="true" severity="secondary" routerLink="/admin">Admin</a>
    }
    <button pButton severity="secondary" class="sign-out-button" (click)="onSignOut()">Sign out</button>
  } @else {
    <a pButton [outlined]="true" severity="secondary" routerLink="/login">Sign in</a>
  }
</nav>
<router-outlet />
